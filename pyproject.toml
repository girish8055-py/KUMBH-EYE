[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kumbheye-surveillance"
version = "4.0.0"
description = "AI-powered multi-camera surveillance dashboard for crowd, vehicle, and parking monitoring"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "KumbhEye Team"},
]

dependencies = [
    "fastapi==0.111.0",
    "Flask>=3.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]==0.30.1",
    "ultralytics>=8.2.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "Pillow>=10.3.0",
    "python-multipart>=0.0.9",
    "secure-smtplib>=0.1.1",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3.0",
    "mypy>=1.8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["backend*", "ml_service*"]

[tool.ruff]
target-version = "py310"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
